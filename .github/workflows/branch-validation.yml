name: NixOS branch validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05

      - name: Validate flake and production build
        shell: bash
        run: |
          set -euo pipefail
          before="$(sha256sum flake.lock)"
          nix flake check --no-write-lock-file
          nix build .#nixosConfigurations.nitro-v15.config.system.build.toplevel --no-link --no-write-lock-file
          nix build .#somewm-stable --no-link --no-write-lock-file
          after="$(sha256sum flake.lock)"
          test "$before" = "$after"
