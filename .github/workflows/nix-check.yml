name: NixOS configuration check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05

      - name: Evaluate and build configuration
        run: |
          nix flake check
          nix build .#nixosConfigurations.nitro-v15.config.system.build.toplevel --no-link
