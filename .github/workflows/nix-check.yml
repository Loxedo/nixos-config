name: NixOS configuration check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05

      - name: Validate shell and Crystal Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n scripts/hardware-check.sh
          bash -n home/loxedo/crystal/autorun.sh

          mapfile -d '' crystal_lua_files < <(
            find home/loxedo/crystal -type f -name '*.lua' -print0
          )

          nix shell nixpkgs#lua5_3 --command bash -c '
            set -euo pipefail
            for file do
              lua -e "assert(loadfile(arg[1]))" -- "$file"
            done
          ' bash "${crystal_lua_files[@]}"

      - name: Evaluate and build configuration
        shell: bash
        run: |
          set -euo pipefail
          before="$(sha256sum flake.lock)"

          nix flake check --no-write-lock-file
          nix build .#nixosConfigurations.nitro-v15.config.system.build.toplevel \
            --no-link \
            --no-write-lock-file
          nix build .#somewm-stable --no-link --no-write-lock-file

          after="$(sha256sum flake.lock)"
          test "$before" = "$after"
